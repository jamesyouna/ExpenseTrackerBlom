<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h3 class="text-center mb-3">Verify Your Email</h3>
                    <p class="text-muted text-center">
                        Enter the 6-digit verification code sent to your email.
                    </p>

                    <form id="verificationForm">
                        <div class="mb-3">
                            <label for="verificationCode" class="form-label">Verification Code</label>
                            <input type="text" id="verificationCode" class="form-control"
                                   maxlength="6" placeholder="Enter 6-digit code" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Verify Email</button>
                        <button type="button" id="resendButton"
                                class="btn btn-secondary w-100 mt-2" onclick="resendCode()">
                            Resend Verification Code
                        </button>
                    </form>

                    <div id="message" class="text-center mt-3"></div>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById("verificationForm");
    const message = document.getElementById("message");

    // Verify the entered code
    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = sessionStorage.getItem("verificationEmail");
        const code = document.getElementById("verificationCode").value;

        if (!email) {
            showMessage("Email address not found. Please register again.", false);
            return;
        }

        try {
            const response = await fetch(
                `/api/v1/verify-email?email=${encodeURIComponent(email)}&code=${encodeURIComponent(code)}`,
                { method: "POST" }
            );

            const result = await response.text();

            if (!response.ok) {
                showMessage(result, false);
                return;
            }

            showMessage("Email verified successfully!", true);
            sessionStorage.removeItem("verificationEmail");

            setTimeout(() => {
                window.location.href = "/api/v1/login-page";
            }, 1500);

        } catch (error) {
            console.error(error);
            showMessage("Unable to verify email.", false);
        }
    });

    // Request a new verification code
    async function resendCode() {
        const email = sessionStorage.getItem("verificationEmail");
        const button = document.getElementById("resendButton");

        if (!email) {
            showMessage("Email address not found. Please register again.", false);
            return;
        }

        button.disabled = true;
        button.textContent = "Sending...";

        try {
            const response = await fetch(
                `/api/v1/resend-verification?email=${encodeURIComponent(email)}`,
                { method: "POST" }
            );

            const result = await response.text();

            if (!response.ok) {
                showMessage(result, false);
                return;
            }

            showMessage("A new verification code has been sent.", true);

        } catch (error) {
            console.error(error);
            showMessage("Unable to resend verification code.", false);

        } finally {
            button.disabled = false;
            button.textContent = "Resend Verification Code";
        }
    }

    // Display success/error messages
    function showMessage(text, success) {
        message.textContent = text;
        message.className = success
            ? "text-success text-center mt-3"
            : "text-danger text-center mt-3";
    }
</script>
</body>
</html>
